<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradingView Advanced Real-Time Chart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }
    .tradingview-widget-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    #tv_chart_container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="tradingview-widget-container">
    <div id="tv_chart_container"></div>
  </div>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    function getParam(k, def) {
      var p = new URLSearchParams(window.location.search);
      return p.get(k) || def;
    }

    var currentSymbol = getParam('symbol', 'EGX:AALR');
    var currentTheme = getParam('theme', 'dark');
    var currentInterval = getParam('interval', 'D');
    var currentLocale = getParam('locale', 'ar');
    var currentTimezone = getParam('timezone', 'Africa/Cairo');

    function createWidget(symbol, theme, interval, locale, timezone) {
      var container = document.getElementById('tv_chart_container');
      if (!container) return;
      container.innerHTML = '';

      new TradingView.widget({
        "autosize": true,
        "symbol": symbol || currentSymbol,
        "interval": interval || currentInterval,
        "timezone": timezone || currentTimezone,
        "theme": theme || currentTheme,
        "style": "1",
        "locale": locale || currentLocale,
        "toolbar_bg": (theme === 'light') ? "#f8fafc" : "#131722",
        "enable_publishing": false,
        "withdateranges": true,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "save_image": false,
        "container_id": "tv_chart_container",
        "hide_volume": false
      });
    }

    window.addEventListener('DOMContentLoaded', function() {
      createWidget(currentSymbol, currentTheme, currentInterval, currentLocale, currentTimezone);
    });

    window.addEventListener('message', function(e) {
      if (!e.data) return;
      var data = e.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(err) { return; }
      }
      if (data.type === 'update') {
        createWidget(data.symbol, data.theme, data.interval, data.locale, data.timezone);
      }
    });
  </script>
</body>
</html>
